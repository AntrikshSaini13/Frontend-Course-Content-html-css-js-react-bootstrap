<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 500px;
            width: 200px;
            background: pink;
            border: 5px solid black;
            margin: 5px;
        }
        #div1{
            position: static;
        }
        #div2{
            position: relative;
            /* top: 20px; */
            right: 20px;
            left: 90px;
        }
        #div3{
            position: fixed;
            top: 20px;
            right: 20px;
            left: 90px;
        }
        #div4{
            position: absolute;
            top: 200px;
            left: 200px;
        }
        #div5{
            position: sticky;
            top: 50px;
        }
        
    </style>
</head>
<body>
    <div id="div5">div5 sticky</div>
    <div id="div1">div1 static</div>
    <div id="div2">div2 relative</div>
    <div id="div3">div3 fixed</div>
    <div id="div4">div4 absolute</div>
    
</body>
</html>
