<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        button{
            height:100px;
            width: 100px;
            background: aqua;            
        }
        #button1{
            box-sizing:border-box;
        }
        #button2{
            box-sizing:content-box;
        }
    </style>
</head>
<body>
    <button id="button1">click me</button><br>
    <button id="button2">click me</button>
</body>
</html>
