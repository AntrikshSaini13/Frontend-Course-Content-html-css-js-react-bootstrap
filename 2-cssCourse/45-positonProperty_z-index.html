<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
        .container{
            position: relative;
        }
        .box1,.box2{
            position: absolute;
            border: 5px solid black;
            width: 100px;
            height: 100px;
            text-align: center;
            font: 25px;

        }
        .box1{
            background: pink;
            left: 20px;
            z-index: 2;;
        }
        .box2{
            background-color: aqua;
            left: 60px;
            top: 20px;
            z-index: 11;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
    </div>
</body>
</html>
