<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-decoration-style:wavy;
            text-decoration-color: blue;
            font-size: 50px;
        }
        *{
            margin: 0;
            padding: 0;
        }
        #first{
            text-decoration-style:wavy;
            text-decoration-color: blue;
            height: 200px;
            width: 200px;
            background: violet;
            border: 5px dotted;
            text-align: center;
            font-size: 25px;
        }
        #second{
            text-decoration:underline;
            text-decoration-color: blue;
            font-size: 2rem;
            background: yellow;
            height: 50%;
            width: 30%;
            text-align: center;
            border: 5px double black;
        }
        a,p{
            text-decoration:underline;
            text-decoration-color: blue;
            font-size: 2rem;
        }
        #first #second{
            text-decoration-style:dashed;
            text-decoration-color: blue;
            font-size: 2rem;
        }
        #third{
            border: 5px dotted pink;
            text-align: center;
            height: 250px;
            width: 250px;
            background-color: aqua;
            font-size: 25px;
        }
        #fourth{
            border: 5px dashed yellow;
            font-size: 2em;
            height: 50%;
            width: 50%;
            background-color:palegreen;
        }
    </style>
</head>
<body>
    Body
    <div id="first" class="">
        first
        <div id="second" class="">second</div>
    </div>
    <a href="">Antriksh</a>
    <p>Lorem ipsum dolor sit.</p>
    <div id="third" class="">
        third
        <div id="fourth" class="">fourth</div>
    </div>
</body>
</html>
