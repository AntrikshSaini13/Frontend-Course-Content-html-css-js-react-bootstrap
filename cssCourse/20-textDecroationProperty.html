<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-decoration</title>
    <style>
        .box1{
            text-align: center;
            height: 200px;
            width: 200px;
            background: yellow;
            text-decoration: line-through;
        }
        .box2{
            text-align: center;
            height: 200px;
            width: 200px;
            background: green;
            text-decoration: overline;
        }
        .box3{
            text-align: center;
            height: 200px;
            width: 200px;
            background: palevioletred;
            text-decoration:underline;
        }
        .box4{
            text-align: center;
            height: 200px;
            width: 200px;
            background: rgb(135, 216, 112);
            text-decoration:underline;
        }
        .box5{
            text-align: center;
            color: brown;
            text-decoration:none;
        }
        
    </style>
</head>
<body>
    <div class="box1">Aman Kumar Saini</div>
    <div class="box2">Aman Kumar Saini</div>
    <div class="box3">Aman Kumar Saini</div>
    <div class="box4">Aman Kumar Saini</div>    
    <a class="box5" href="">Antriksh Saini</a><br>
    
</body>
</html>
