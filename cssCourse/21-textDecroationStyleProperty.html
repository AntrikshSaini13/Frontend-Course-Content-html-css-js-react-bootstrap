<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text Decoration color</title>
    <style>
        .box6{
            text-align: center;
            color: blue;
            text-decoration-style:wavy;
        }
        .box7{
            color: gold;
            text-decoration-style:dotted;
        }
        .box8{
            color: black;
            text-decoration-style:solid;
            text-decoration-color:yellow ;
        }
        .box9{
            color: gold;
            text-decoration-style:double;
        }
        .box10{
            color: palevioletred;
            text-decoration-style:dashed;
        }
        .box11{
            color: green;
            text-decoration:none;
        }
    </style>
</head>
<body>
    <a class="box6" href="">Antriksh Saini</a><br>
    <a class="box7" href="">Antriksh Saini</a><br>
    <a class="box8" href="">Antriksh Saini</a><br>
    <a class="box9" href="">Antriksh Saini</a><br>
    <a class="box10" href="">Antriksh Saini</a><br>
    <a class="box11" href="">Antriksh Saini</a><br>
</body>
</html>
