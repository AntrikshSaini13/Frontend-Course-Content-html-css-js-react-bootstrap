<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* group Selector */
        #h1,#h2,#h3{
            color: aqua;
        }
        .h1,.h2,.h3{
            color: greenyellow;
        }
    </style>
</head>
<body>
    <h1 id="h1">Lorem ipsum dolor sit amet.</h1>
    <h1 id="h2">Lorem ipsum dolor sit amet.</h1>
    <h1 id="h3">Lorem ipsum dolor sit amet.</h1>
    <h1 class="h1">Lorem ipsum dolor sit amet consectetur.</h1>
    <h1 class="h2">Lorem ipsum dolor sit amet consectetur.</h1>
    <h1 class="h3">Lorem ipsum dolor sit amet consectetur.</h1>
</body>
</html>
